[project]
name = "puckdesk"
version = "0.1.0"
description = "Fantasy hockey streaming assistant: NHL stats, matchup simulation and add/drop planning behind an MCP server."
readme = "README.md"
authors = [{ name = "Jacob Lazda" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0,<3",
    "numpy>=2.4.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "scipy>=1.17.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local podcast transcription on Apple Silicon (the Mac mini).
mac = ["mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
puckdesk = "puckdesk.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
