[gamedaytweets]
# Beat-writer tweets on lines, goalies and news, plus starting-goalie guesses.
# Free on the site, so no X API is needed.
url = "https://www.gamedaytweets.com/"
pages = 3

[paywalled]
# Need a subscription; not fetched automatically.
