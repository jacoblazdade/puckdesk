# Jacob's Yahoo leagues. Flaim (the Yahoo connector in Claude) doesn't return
# league settings, waiver rules or week dates, so they live here and override
# whatever a LeagueState says for a league listed below.
#
# Weeks run Monday to Sunday. Week 1 ends on week1_end; every later week is
# the seven days after the one before.
# Categories use Yahoo's display names (SHO, SV%, ...).
# Roster positions are counts per slot; IR+ slots don't play.
# Waivers: continual rolling, so a dropped player is on waivers for
# waiver_days from the moment of the drop.
# min_goalie_appearances: Yahoo's weekly minimum. A team below it can't win
# any goalie category that week; an appearance means the goalie touched the ice.

week1_end = 2026-10-04

